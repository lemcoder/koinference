name: Build Native Artifacts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/llamacpp/cpp/.cpm

jobs:
  build-apple:
    name: Build Apple targets
    runs-on: macos-latest
    defaults:
      run:
        working-directory: llamacpp/cpp
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: llamacpp/cpp/.cpm
          key: cpm-apple-${{ hashFiles('llamacpp/cpp/CMakeLists.txt') }}

      - name: Build macosArm64
        run: |
          cmake --preset macosArm64
          cmake --build --preset macosArm64 -j$(sysctl -n hw.ncpu)
          mkdir -p ../../prebuilt/macosArm64
          find build/macosArm64 -name "*.a" | xargs libtool -static -o ../../prebuilt/macosArm64/libkoinference-facade.a

      - name: Build macosX64
        run: |
          cmake --preset macosX64
          cmake --build --preset macosX64 -j$(sysctl -n hw.ncpu)
          mkdir -p ../../prebuilt/macosX64
          find build/macosX64 -name "*.a" | xargs libtool -static -o ../../prebuilt/macosX64/libkoinference-facade.a

      - name: Build iosArm64
        run: |
          cmake --preset iosArm64
          cmake --build --preset iosArm64 -j$(sysctl -n hw.ncpu)
          mkdir -p ../../prebuilt/iosArm64
          find build/iosArm64 -name "*.a" | xargs libtool -static -o ../../prebuilt/iosArm64/libkoinference-facade.a

      - name: Build iosSimulatorArm64
        run: |
          cmake --preset iosSimulatorArm64
          cmake --build --preset iosSimulatorArm64 -j$(sysctl -n hw.ncpu)
          mkdir -p ../../prebuilt/iosSimulatorArm64
          find build/iosSimulatorArm64 -name "*.a" | xargs libtool -static -o ../../prebuilt/iosSimulatorArm64/libkoinference-facade.a

      - uses: actions/upload-artifact@v4
        with:
          name: apple-prebuilt
          path: llamacpp/prebuilt/

  build-android:
    name: Build Android targets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llamacpp/cpp
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: llamacpp/cpp/.cpm
          key: cpm-android-${{ hashFiles('llamacpp/cpp/CMakeLists.txt') }}

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build androidNativeArm64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake --preset androidNativeArm64
          cmake --build --preset androidNativeArm64 -j$(nproc)
          mkdir -p ../../prebuilt/androidNativeArm64
          {
            echo "CREATE ../../prebuilt/androidNativeArm64/libkoinference-facade.a"
            find build/androidNativeArm64 -name "*.a" | sed 's/^/ADDLIB /'
            echo "SAVE"
            echo "END"
          } | ar -M

      - name: Build androidNativeX64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake --preset androidNativeX64
          cmake --build --preset androidNativeX64 -j$(nproc)
          mkdir -p ../../prebuilt/androidNativeX64
          {
            echo "CREATE ../../prebuilt/androidNativeX64/libkoinference-facade.a"
            find build/androidNativeX64 -name "*.a" | sed 's/^/ADDLIB /'
            echo "SAVE"
            echo "END"
          } | ar -M

      - uses: actions/upload-artifact@v4
        with:
          name: android-prebuilt
          path: llamacpp/prebuilt/

  push-artifacts:
    name: Commit prebuilt artifacts to PR branch
    runs-on: ubuntu-latest
    needs: [build-apple, build-android]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: apple-prebuilt
          path: llamacpp/prebuilt/

      - uses: actions/download-artifact@v4
        with:
          name: android-prebuilt
          path: llamacpp/prebuilt/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llamacpp/prebuilt/
          if git diff --staged --quiet; then
            echo "Prebuilt artifacts unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "ci: update prebuilt native artifacts [skip ci]"
          git push
