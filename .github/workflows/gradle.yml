# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

# Pull requests only, plus on demand. It used to also run on push to main, which meant every
# merge paid for the whole matrix twice — once for the PR and again for the push of the same
# commits. macOS runners bill at 10x on a private repository, and this workflow is mostly macOS.
on:
  pull_request:
    branches: [ "main" ]
    # Documentation-only changes cannot break a build, and this repository gets a lot of them.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
  workflow_call:

# A new push to a pull request cancels the run still working on the previous one. Without this,
# a branch pushed three times in ten minutes pays for three full matrices to learn about the
# last commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The .a files are no longer committed, so build them first and hand them over as artifacts.
  natives:
    name: Native artifacts
    uses: ./.github/workflows/build-artifacts.yml

  # Everything that needs a Mac, in one job.
  #
  # This was three: two matrix rows and a separate LiteRT-LM job. Each paid its own checkout, JDK
  # setup and Kotlin/Native download before testing anything, and each minute of that counts ten
  # times over on a private repository. One job pays the setup once and runs the lot.
  apple:
    name: Apple targets
    needs: natives
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Download prebuilt natives
      uses: actions/download-artifact@v4
      with:
        pattern: "*-prebuilt"
        merge-multiple: true
        path: backends/llamacpp/build/prebuilt/

    # Keyed on the version catalogue, which is where the Kotlin version lives. It used to hash
    # '**/.lock', which matches only git-ignored Gradle files: on a fresh checkout that hashes
    # nothing, so the key never changed and the cache never refreshed after a Kotlin bump —
    # paying for the distribution download on every run instead.
    - uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-

    # 154 MB, pinned by SHA256 in native/CMakeLists.txt; the key tracks that file so a version
    # bump re-downloads rather than linking against the previous release.
    - uses: actions/cache@v4
      with:
        path: backends/litertlm/native/.prebuilt
        key: litertlm-prebuilt-${{ hashFiles('backends/litertlm/native/CMakeLists.txt') }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # llama.cpp's own test model, 1.2 MB. Without it the generation tests skip, and CI would be
    # proving that the bridges link and nothing about whether they produce tokens.
    - name: Fetch a tiny GGUF model
      run: |
        curl -fsSL -o "$RUNNER_TEMP/stories260K.gguf" \
          https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
        echo "KOI_TEST_GGUF=$RUNNER_TEMP/stories260K.gguf" >> "$GITHUB_ENV"

    # macosX64 runs the generation tests against that model; the iOS simulator gets its own
    # filesystem view, so a host path there would be testing something else.
    - name: macOS and iOS tests
      run: |
        ./gradlew :core:macosX64Test :backends:llamacpp:macosX64Test \
                  :core:iosSimulatorArm64Test :backends:llamacpp:iosSimulatorArm64Test

    # Its own step rather than its own job: it needs the same Mac, and generation is skipped here
    # because the smallest published .litertlm is 136 MB. What this proves is that the facade
    # builds, cinterop binds it and the test binary links against the runtime.
    - name: LiteRT-LM tests
      run: ./gradlew :backends:litertlm:macosArm64Test :benchmark:core:macosArm64Test

  jvm:
    name: JVM and Linux
    needs: natives
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: "*-prebuilt"
        merge-multiple: true
        path: backends/llamacpp/build/prebuilt/
    - uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Fetch a tiny GGUF model
      run: |
        curl -fsSL -o "$RUNNER_TEMP/stories260K.gguf" \
          https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
        echo "KOI_TEST_GGUF=$RUNNER_TEMP/stories260K.gguf" >> "$GITHUB_ENV"
    # The stub comes from the natives job; -PkoiStubDir stops CMake rebuilding it here. Relative
    # because github.workspace expanded to "" inside the matrix this replaced, which silently
    # produced /backends/… and an UnsatisfiedLinkError.
    - name: Tests
      run: |
        ./gradlew :core:jvmTest :backends:llamacpp:jvmTest \
                  :core:linuxX64Test :backends:llamacpp:linuxX64Test \
                  -PkoiStubDir=build/prebuilt/jni/linux_x64

  android:
    name: Android AAR
    needs: natives
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # The JNI library is built per ABI by the interop's own CMake build, so this job needs the NDK
    # rather than the prebuilt archives the other jobs consume.
    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c

    - name: Assemble the AARs
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        ./gradlew :backends:llamacpp:bundleAndroidMainAar :core:bundleAndroidMainAar \
                  :backends:litertlm:bundleAndroidMainAar

    # Its own build, so the main build's `assemble` never touches it — which means nothing here
    # would notice it breaking. It carries the inference service and the OpenAI server, and is
    # also the app APK the instrumentation tests are installed alongside.
    - name: Assemble the benchmark app
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      working-directory: benchmark/app
      run: ./gradlew assembleBenchmark

    - name: Check the app ships the service in its own process
      run: |
        apk=benchmark/app/build/outputs/apk/benchmark/koinference-benchmark-app-benchmark.apk
        aapt2=$(find "${ANDROID_HOME}/build-tools" -name aapt2 | sort | tail -1)
        manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
        # The separate process is the entire reason the service exists: in a shared one its PSS
        # would include the UI and the test runner. A merge or refactor dropping the attribute
        # would leave every memory number quietly wrong, so it is asserted rather than trusted.
        echo "$manifest" | grep -q 'android:process.*":inference"' || {
          echo "the inference service is not in its own process"; exit 1; }
        # Both engines' libraries, both ABIs: the app is useless for benchmarking otherwise.
        for abi in arm64-v8a x86_64; do
          unzip -l "$apk" | grep -q "lib/$abi/.*llamacpp.*\.so" || { echo "missing llama.cpp for $abi"; exit 1; }
          unzip -l "$apk" | grep -q "lib/$abi/liblitertlm_jni.so" || { echo "missing LiteRT-LM for $abi"; exit 1; }
        done
        echo "app APK carries both engines for both ABIs, service is process-isolated"

    # The runtime's logic is common code and needs no device: this compiles the Android actuals
    # against it and runs the lot on the JVM, minutes before the emulator is even up.
    - name: LiteRT-LM host tests
      run: ./gradlew :backends:litertlm:testAndroidHostTest

    - name: Check the AAR ships a library per ABI
      run: |
        aar=backends/llamacpp/build/outputs/aar/llamacpp.aar
        unzip -l "$aar" | grep -q 'jni/arm64-v8a/.*\.so' || { echo "missing arm64-v8a"; exit 1; }
        unzip -l "$aar" | grep -q 'jni/x86_64/.*\.so' || { echo "missing x86_64"; exit 1; }
        unzip -l "$aar" | grep -E 'jni/|classes.jar'

    # This assertion used to be the opposite: the AAR carried no .so of its own, because the
    # runtime arrived from Maven as a transitive dependency. Since the move to the C API it
    # packages both the JNI stub and liblitert-lm.so per ABI, and an AAR missing either is one
    # that fails at dlopen on a device rather than at build time here.
    - name: Check the LiteRT-LM AAR ships the runtime and the stub per ABI
      run: |
        aar=backends/litertlm/build/outputs/aar/litertlm.aar
        for abi in arm64-v8a x86_64; do
          unzip -l "$aar" | grep -q "jni/$abi/liblitert-lm.so" || { echo "missing the runtime for $abi"; exit 1; }
          unzip -l "$aar" | grep -q "jni/$abi/.*litertlm.*stubs\.so" || { echo "missing the JNI stub for $abi"; exit 1; }
        done
        unzip -l "$aar" | grep -E 'jni/|classes.jar'

    # llama.cpp's own test model: 1.2 MB, small enough to download and generate from on an emulator.
    - name: Fetch a tiny GGUF model
      run: |
        curl -fsSL -o stories260K.gguf \
          https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
        ls -l stories260K.gguf

    # Two ABIs of llama.cpp, the NDK, the SDK and a system image do not fit alongside the runner's
    # preinstalled toolchains: the emulator refuses to start with "does not have enough disk space".
    - name: Free disk space
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
        sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
        sudo docker image prune --all --force > /dev/null 2>&1 || true
        df -h / | tail -1

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The AAR checks are structural; this is the only step where ART loads the .so and the runtimes
    # execute on the target ABI. LiteRT-LM's generation cases skip — its smallest model is 136 MB —
    # but loading still proves its liblitertlm_jni.so resolves and is called.
    - name: Instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: default
        disable-animations: true
        script: |
          adb shell mkdir -p /data/local/tmp/koinference
          adb push stories260K.gguf /data/local/tmp/koinference/stories260K.gguf
          ./gradlew :backends:llamacpp:connectedAndroidDeviceTest \
                    :backends:litertlm:connectedAndroidDeviceTest
