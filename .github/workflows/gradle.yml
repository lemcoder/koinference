# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  # The .a files are no longer committed, so build them first and hand them over as artifacts.
  natives:
    name: Native artifacts
    uses: ./.github/workflows/build-artifacts.yml

  build:
    needs: natives
    strategy:
      # One target failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - target: :core:iosSimulatorArm64Test :backends:llamacpp:iosSimulatorArm64Test
            os: macos-latest
          - target: :core:macosX64Test :backends:llamacpp:macosX64Test
            os: macos-latest
          - target: :core:jvmTest :backends:llamacpp:jvmTest :core:linuxX64Test :backends:llamacpp:linuxX64Test
            os: ubuntu-latest
            # The stub is built by the natives job; do not rebuild it through CMake here.
            # Relative to the module: github.workspace is unavailable in a matrix and expands to "".
            extraArgs: -PkoiStubDir=build/prebuilt/jni/linux_x64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    # llama.cpp's own test model, 1.2 MB. The generation tests skip without it, which would mean
    # CI proving that the bridges link and nothing about whether they produce tokens.
    # Not set for the iOS row: the simulator gets its own filesystem view and a host path there
    # is a different kind of test than this one.
    - name: Fetch a tiny GGUF model
      if: matrix.os != 'macos-latest' || contains(matrix.target, 'macosX64')
      run: |
        curl -fsSL -o "$RUNNER_TEMP/stories260K.gguf" \
          https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
        echo "KOI_TEST_GGUF=$RUNNER_TEMP/stories260K.gguf" >> "$GITHUB_ENV"
    - name: Download prebuilt natives
      uses: actions/download-artifact@v4
      with:
        pattern: "*-prebuilt"
        merge-multiple: true
        path: backends/llamacpp/build/prebuilt/
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
      with:
        arguments: ${{ matrix.target }} ${{ matrix.extraArgs }}

  # Its own job rather than a row in the matrix above: this module does not consume the prebuilt
  # llama.cpp archives, it drives its own CMake (which downloads and hash-checks Google's
  # xcframework), and macOS arm64 is the only host target it has.
  litertlm:
    name: LiteRT-LM macOS arm64
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    # 44 MB per release, pinned by SHA256 in native/CMakeLists.txt — the key tracks that file so a
    # version bump re-downloads instead of linking against the previous release.
    - uses: actions/cache@v4
      with:
        path: backends/litertlm/native/.prebuilt
        key: litertlm-prebuilt-${{ hashFiles('backends/litertlm/native/CMakeLists.txt') }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    # Generation needs a 136 MB model and is skipped here; what this proves is that the facade
    # builds, cinterop binds it and the test binary links against the runtime dylib.
    - name: Build the facade and run the tests
      run: ./gradlew :backends:litertlm:macosArm64Test

  android:
    name: Android AAR
    needs: natives
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # The JNI library is built per ABI by the interop's own CMake build, so this job needs the NDK
    # rather than the prebuilt archives the other jobs consume.
    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c

    - name: Assemble the AARs
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        ./gradlew :backends:llamacpp:bundleAndroidMainAar :core:bundleAndroidMainAar \
                  :backends:litertlm:bundleAndroidMainAar

    # Its own build, so the main build's `assemble` never touches it — which means nothing here
    # would notice it breaking. It carries the inference service and the OpenAI server, and is
    # also the app APK the instrumentation tests are installed alongside.
    - name: Assemble the benchmark app
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      working-directory: benchmark/app
      run: ./gradlew assembleBenchmark

    - name: Check the app ships the service in its own process
      run: |
        apk=benchmark/app/build/outputs/apk/benchmark/koinference-benchmark-app-benchmark.apk
        aapt2=$(find "${ANDROID_HOME}/build-tools" -name aapt2 | sort | tail -1)
        manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
        # The separate process is the entire reason the service exists: in a shared one its PSS
        # would include the UI and the test runner. A merge or refactor dropping the attribute
        # would leave every memory number quietly wrong, so it is asserted rather than trusted.
        echo "$manifest" | grep -q 'android:process.*":inference"' || {
          echo "the inference service is not in its own process"; exit 1; }
        # Both engines' libraries, both ABIs: the app is useless for benchmarking otherwise.
        for abi in arm64-v8a x86_64; do
          unzip -l "$apk" | grep -q "lib/$abi/.*llamacpp.*\.so" || { echo "missing llama.cpp for $abi"; exit 1; }
          unzip -l "$apk" | grep -q "lib/$abi/liblitertlm_jni.so" || { echo "missing LiteRT-LM for $abi"; exit 1; }
        done
        echo "app APK carries both engines for both ABIs, service is process-isolated"

    # The runtime's logic is common code and needs no device: this compiles the Android actuals
    # against it and runs the lot on the JVM, minutes before the emulator is even up.
    - name: LiteRT-LM host tests
      run: ./gradlew :backends:litertlm:testAndroidHostTest

    - name: Check the AAR ships a library per ABI
      run: |
        aar=backends/llamacpp/build/outputs/aar/llamacpp.aar
        unzip -l "$aar" | grep -q 'jni/arm64-v8a/.*\.so' || { echo "missing arm64-v8a"; exit 1; }
        unzip -l "$aar" | grep -q 'jni/x86_64/.*\.so' || { echo "missing x86_64"; exit 1; }
        unzip -l "$aar" | grep -E 'jni/|classes.jar'

    # The opposite expectation, and the reason litertlm declares its runtime as `api`: the .so is
    # Google's, merged into the app by the transitive dependency. An .so appearing in ours would
    # mean something started building native code for a module that has no native code.
    - name: Check the LiteRT-LM AAR ships no library of its own
      run: |
        aar=backends/litertlm/build/outputs/aar/litertlm.aar
        # `if`, not `grep … && exit 1`: the steps run under `bash -e`, where a grep that matches
        # nothing fails the list and would turn the good case into a red job.
        if unzip -l "$aar" | grep -q '\.so'; then
          echo "unexpected .so in $aar"
          exit 1
        fi
        unzip -l "$aar" | grep -E 'classes.jar|AndroidManifest'

    # llama.cpp's own test model: 1.2 MB, small enough to download and generate from on an emulator.
    - name: Fetch a tiny GGUF model
      run: |
        curl -fsSL -o stories260K.gguf \
          https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
        ls -l stories260K.gguf

    # Two ABIs of llama.cpp, the NDK, the SDK and a system image do not fit alongside the runner's
    # preinstalled toolchains: the emulator refuses to start with "does not have enough disk space".
    - name: Free disk space
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
        sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
        sudo docker image prune --all --force > /dev/null 2>&1 || true
        df -h / | tail -1

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The AAR checks are structural; this is the only step where ART loads the .so and the runtimes
    # execute on the target ABI. LiteRT-LM's generation cases skip — its smallest model is 136 MB —
    # but loading still proves its liblitertlm_jni.so resolves and is called.
    - name: Instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: default
        disable-animations: true
        script: |
          adb shell mkdir -p /data/local/tmp/koinference
          adb push stories260K.gguf /data/local/tmp/koinference/stories260K.gguf
          ./gradlew :backends:llamacpp:connectedAndroidDeviceTest \
                    :backends:litertlm:connectedAndroidDeviceTest
