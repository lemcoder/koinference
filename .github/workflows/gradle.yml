# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  # The .a files are no longer committed, so build them first and hand them over as artifacts.
  natives:
    name: Native artifacts
    uses: ./.github/workflows/build-artifacts.yml

  build:
    needs: natives
    strategy:
      matrix:
        include:
          - target: :core:iosSimulatorArm64Test :backends:llamacpp:iosSimulatorArm64Test
            os: macos-latest
          - target: :core:macosX64Test :backends:llamacpp:macosX64Test
            os: macos-latest
          - target: :core:jvmTest :backends:llamacpp:jvmTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Download prebuilt natives
      uses: actions/download-artifact@v4
      with:
        pattern: "*-prebuilt"
        merge-multiple: true
        path: backends/llamacpp/build/prebuilt/
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
      with:
        arguments: ${{ matrix.target }}
