name: Deploy benchmark site

# Publishes site/ (index.html + the accumulating data.ndjson) to GitHub Pages. Runs when the site
# or its data changes on main, and on demand. The device-benchmark workflow commits fresh data to
# site/data.ndjson, which lands here and redeploys.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a running one, so a redeploy cannot truncate a publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
