# This build loads its own plugin classpath *and* the main build's through the composite, which
# is two Kotlin/AGP toolchains in one daemon. The defaults run out of Metaspace part way through
# configuring the included build, and the failure surfaces as unrelated task-creation errors.
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1536M -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
