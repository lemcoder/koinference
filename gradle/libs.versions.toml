[versions]
konsist = "0.17.3"
kotlin = "2.3.10"
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.9.0"
konanPlugin = "1.2.0-alpha05"
mavenPublish = "0.37.0"
agp = "9.2.1"
androidCompileSdk = "37"
androidMinSdk = "24"
# llama.cpp only. Its ARM kernels are chosen when ggml is compiled — dotprod, no run-time fallback —
# so the AAR refuses hardware it would otherwise crash on. 31 is a deliberate floor, not a technical
# one: the extension predates it, but the library is younger than Android 10 and nothing is gained by
# claiming devices nobody is shipping to. The CPU is still checked at run time, because API level
# does not imply dotprod. See docs/performance.md.
androidMinSdkLlamaCpp = "31"
# Cera, a Rust GGUF engine reached through its published UniFFI/JNA Kotlin bindings. Two artifacts
# rather than one because the natives differ: the JVM jar carries desktop libraries, the AAR carries
# jniLibs and JNA's @aar dispatch.
cera = "0.4.0"
androidxTest = "1.7.0"
androidxJunit = "1.3.0"

[libraries]
cera-ffi-jvm = { module = "com.hyeons-lab:cera-ffi-jvm", version.ref = "cera" }
cera-ffi-android = { module = "com.hyeons-lab:cera-ffi-android", version.ref = "cera" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
konan = { id = "io.github.lemcoder.konanplugin", version.ref = "konanPlugin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
# AGP 9 dropped com.android.library + KMP; this is the KMP-specific Android plugin.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# The benchmark harness is an app plus a test APK, which is what Firebase Test Lab runs.
androidApplication = { id = "com.android.application", version.ref = "agp" }
